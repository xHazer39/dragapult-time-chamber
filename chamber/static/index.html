<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>Dragapult Time Chamber</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="hud">
    <a class="brand capsule" href="#today" aria-label="Time Chamber · Today">
      <span class="mark" id="mark"></span>
      <span class="brand-name"><b>Time Chamber</b><small>Dragapult ex</small></span>
    </a>
    <nav class="nav capsule" aria-label="Sections">
      <a href="#today" data-view="today" title="Today · G T"><span data-icon="today"></span><span class="nav-label">Today</span><span class="count" id="count-today"></span></a>
      <a href="#case" data-view="case" title="Case · G C"><span data-icon="case"></span><span class="nav-label">Case</span></a>
      <a href="#progress" data-view="progress" title="Progress · G P"><span data-icon="progress"></span><span class="nav-label">Progress</span></a>
      <a href="#inbox" data-view="inbox" title="Inbox · G I"><span data-icon="inbox"></span><span class="nav-label">Inbox</span><span class="count" id="count-inbox"></span></a>
    </nav>
    <div class="hud-end">
      <button class="cmdk capsule" id="cmdk" aria-label="Command palette" aria-haspopup="dialog"><span class="cmdk-label">Commands</span></button>
      <div class="deck-chip capsule" id="deck-chip"></div>
      <button class="icon capsule" id="collapse" title="Compact navigation" aria-label="Compact navigation"></button>
    </div>
  </header>
  <main id="main" class="page" aria-live="polite"></main>
  <div class="actionbar" id="actionbar" role="note" aria-label="Keyboard shortcuts for this step"></div>
  <dialog class="palette" id="palette" aria-label="Command palette">
    <input type="text" id="palette-input" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list"
      aria-label="Search commands" placeholder="Type a command or a case…" autocomplete="off" spellcheck="false">
    <ul id="palette-list" role="listbox" aria-label="Commands"></ul>
    <div class="palette-foot" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>Esc</kbd> close</span></div>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
